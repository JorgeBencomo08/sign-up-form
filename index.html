<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Document</title>
</head>

<body>
    <div class="container">
        <div>
            <h1>Formulario de prueba</h1>
            <p> Este formulario es para probar las herramientas ensenadas de css y html enn esta parte del curso </p>

            <form>
                <div class="form-group">
                    <label for="nombre">Nombre</label>
                    <input type="text" id="nombre" name="nombre" required placeholder="Nombre">
                </div>
                <div class="form-group">
                    <label for="apellido">Apellido</label>
                    <input type="text" id="apellido" name="apellido" required placeholder="Apellido">
                </div>
                <div class="form-group">
                    <label for="email">Correo electrónico</label>
                    <input type="email" id="email" name="email" required placeholder="Correo electrónico">
                </div>
                <div class="form-group">
                    <label for="telefono">Número de teléfono</label>
                    <input type="tel" id="telefono" name="telefono" required placeholder="Número de teléfono">
                </div>
                <button type="submit">Enviar</button>
            </form>
        </div>
        <div class="imagen">
<img src="imagen/halie-west-25xggax4bSA-unsplash.jpg">
        </div>
    </div>

</body>

</html>
